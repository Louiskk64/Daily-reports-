version: "3.8"

services:
  monitor:
    build: .
    command: python monitor.py
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - TZ=Asia/Kolkata

  scheduler:
    build: .
    command: python scheduler.py
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - TZ=Asia/Kolkata
